[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-tech-chat-backend"
version = "0.1.0"
description = "API do chatbot acadêmico da Aurora Tech"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

